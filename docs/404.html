<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    (function () {
      var redirect = window.location.search;

      if (redirect.startsWith("?/")) {
        var decoded = redirect
          .slice(1)
          .replace(/~and~/g, "&");

        var parts = decoded.split("&");
        var path = parts.shift();

        var query = parts.length
          ? "?" + parts.join("&")
          : "";

        window.history.replaceState(
          null,
          "",
          path + query + window.location.hash
        );
      }
    })();
  </script>
</head>

<body>
</body>

</html>
